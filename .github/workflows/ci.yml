name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  database:
    name: Migrations and database behaviour
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Apply migrations to a throwaway database and assert behaviour
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        # Invoked through bash rather than as ./run.sh: the executable bit does
        # not survive a zip round trip through Windows, and CI should not depend
        # on a file mode that a contributor's filesystem can silently drop.
        run: bash supabase/tests/run.sh

  expo:
    name: Expo project health and bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Catches the class of failure that only shows up 20 minutes into an EAS
      # build: package versions that do not match the SDK, invalid app config
      # keys, duplicate native modules, and SDK versions with known
      # regressions. Cheap here, expensive there.
      - name: expo-doctor
        run: pnpm --filter @itala/mobile run expo:doctor

      # Typechecking does not prove the app can be bundled. A bad import, an
      # unresolvable module or a broken Metro config all pass tsc and fail
      # Metro. Exporting both platforms is the closest thing to a build that
      # runs in seconds.
      - name: Bundle for iOS and Android
        run: pnpm --filter @itala/mobile run bundle:check
