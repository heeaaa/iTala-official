name: CI

# Independent verification of every pull request and every push to main.
# The repo's other workflow only keeps a free Supabase project awake - it does
# not verify anything, so before this file existed a PR could merge with a
# broken reducer, a broken sync layer or type errors and nothing would object.
on:
  pull_request:
  push:
    branches: [main]

# Least privilege: nothing here writes to the repo, releases or packages.
permissions:
  contents: read

# A newer push to the same ref makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Kept as its own job rather than a step inside `verify`: lint failures are
  # cheap and mechanical, and a separate job reports them in about a minute
  # instead of behind a Postgres service and the whole regression suite. It also
  # means a lint failure and a test failure are visible in the same run rather
  # than the first one masking the second.
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `eslint .` exits non-zero on any error. The config promotes the rules
      # that were fixed to clean (unused symbols, import ordering) to errors, so
      # a new violation fails here. react-hooks/exhaustive-deps is deliberately
      # left as a warning - its two current hits are F-14 and correcting them is
      # a behaviour change, not a lint fix. See eslint.config.js.
      #
      # `npm run format:check` is intentionally NOT run yet: Prettier would
      # reformat all 54 files in the repo, so the gate is added only once that
      # mechanical reformat lands on its own. See docs/CODE_REVIEW.md F-09.
      - name: Run ESLint
        run: npm run lint

  verify:
    name: Types, reducer, sync, static, database
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # tests/sql/run.js exits 0 when no Postgres answers, which is what keeps
    # `npm test` usable on a laptop with nothing running. In CI that same
    # default would mean a green tick with zero database coverage, so
    # ITALA_REQUIRE_DB below turns the skip into a failure. That makes this
    # service load-bearing rather than decorative.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      ITALA_REQUIRE_DB: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # `npm ci` installs strictly from package-lock.json: a run is
      # reproducible, and a lockfile that has drifted from package.json fails
      # here instead of silently resolving to different versions.
      - name: Install dependencies
        run: npm ci

      - name: Ensure psql is available
        shell: bash
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi
          psql --version

      # One entry point, the same one contributors run locally, so CI and local
      # verification cannot drift apart. It covers the type check, the
      # reducer/stats/parser suite, the two-device sync suite, the static
      # structural checks and the SQL suites against the Postgres service above.
      # `shell: bash` is deliberate: it sets pipefail, so a failing suite still
      # fails the step despite the pipe into tee.
      - name: Run regression suite
        shell: bash
        run: node tests/run.js 2>&1 | tee test-output.txt

      # Keeps the pass/fail counts auditable after the run logs age out.
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.txt
          retention-days: 30

  bundle:
    name: Bundle (Metro + Hermes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # As close to a build as this repo can verify without EAS credentials: it
      # resolves and bundles every module through Metro and compiles the result
      # with Hermes, which catches broken imports, bad requires and syntax the
      # type checker never sees. A shippable native binary still needs
      # `eas build` and signing credentials, which do not belong in CI here.
      - name: Export JS bundle
        run: npx expo export --platform android --output-dir dist

      - name: Upload bundle metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-metadata
          path: dist/metadata.json
          if-no-files-found: warn
          retention-days: 7
